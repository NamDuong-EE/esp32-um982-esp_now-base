; PlatformIO Project Configuration File

[platformio]
default_envs = esp32u_base_espnow

[base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient @ ^2.8
lib_ignore =
    mockPubSubClient
    mockLoraWan
    mockWiFi
build_unflags =
    -std=gnu++11
    -std=c++11
    -std=c++14
build_flags =
    -std=gnu++17
    -DFIRMWARE_ROLE_BASE=1
build_src_filter =
    +<main.cpp>
    +<functions/Rtcm_Frame_Reader.cpp>
    +<functions/NetworkMqttManager.cpp>
    +<hardware/BaseEspnow_sender.cpp>

; Default development environment: Wi-Fi provides Internet/MQTT while
; ESP-NOW LR remains on the fixed radio channel.
[env:esp32u_base_espnow]
extends = base
build_flags =
    ${base.build_flags}
    -DCONNECT_USING_WIFI=1
    -DCONNECT_USING_4G=0

; Future field environment for a SIM7600-class modem.
[env:esp32u_base_4g_mqtt]
extends = base
lib_deps =
    ${base.lib_deps}
    vshymanskyy/TinyGSM @ ^0.12.0
build_flags =
    ${base.build_flags}
    -DCONNECT_USING_WIFI=0
    -DCONNECT_USING_4G=1
    -DTINY_GSM_MODEM_SIM7600
